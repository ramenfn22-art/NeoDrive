<!DOCTYPE html>
<html>
<head>
    <title>Signup - NeoDrive</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="page fade-in">

    <div class="container">
        <header>
            <img src="{{ url_for('static', filename='logo.png') }}" class="logo">
            <h1>Create Account</h1>
        </header>

        <form action="/signup" method="POST" class="card">
            <input type="text" name="username" placeholder="Username" required class="input">
            <input type="password" name="password" placeholder="Password" required class="input">
            <button type="submit" class="primary-btn">Sign Up</button>
        </form>

        <p style="text-align:center; margin-top:10px;">
            <a href="/login" class="ghost-btn">Already have an account?</a>
        </p>
    </div>

</body>
</html>
