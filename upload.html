<!DOCTYPE html>
<html>
<head>
    <title>Upload File</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="page">
    <div class="container">

        <header>
            <img src="{{ url_for('static', filename='logo.png') }}" class="logo">
            <h1>Upload to NeoDrive</h1>
            <p class="subtitle">Drag & drop or browse your files</p>
        </header>

        <section class="card">

            <!-- Drag & Drop Zone -->
            <div id="dropZone" class="drop-zone">
                <p>Drag & Drop your file here</p>
                <span>or click to browse</span>
                <input type="file" id="fileInput" name="file">
            </div>

            <!-- Upload Button -->
            <button id="uploadBtn" class="primary-btn">Upload</button>

            <!-- Progress Bar -->
            <div id="progressContainer" class="progress-container hidden">
                <div id="progressBar" class="progress-bar"></div>
            </div>

            <a href="/" class="ghost-btn">← Back</a>
        </section>
    </div>

    <script>
        document.body.classList.add("fade-in");

        const dropZone = document.getElementById("dropZone");
        const fileInput = document.getElementById("fileInput");
        const uploadBtn = document.getElementById("uploadBtn");
        const progressContainer = document.getElementById("progressContainer");
        const progressBar = document.getElementById("progressBar");

        let selectedFile = null;

        // Highlight on drag
        dropZone.addEventListener("dragover", (e) => {
            e.preventDefault();
            dropZone.classList.add("drag-over");
        });

        // Remove highlight
        dropZone.addEventListener("dragleave", () => {
            dropZone.classList.remove("drag-over");
        });

        // Handle dropped file
        dropZone.addEventListener("drop", (e) => {
            e.preventDefault();
            dropZone.classList.remove("drag-over");

            selectedFile = e.dataTransfer.files[0];
            dropZone.querySelector("p").textContent = selectedFile.name;
        });

        // Clicking the zone opens file picker
        dropZone.addEventListener("click", () => {
            fileInput.click();
        });

        // File chosen manually
        fileInput.addEventListener("change", () => {
            selectedFile = fileInput.files[0];
            dropZone.querySelector("p").textContent = selectedFile.name;
        });

        // Upload button
        uploadBtn.addEventListener("click", () => {
            if (!selectedFile) return;

            progressContainer.classList.remove("hidden");

            const formData = new FormData();
            formData.append("file", selectedFile);

            const xhr = new XMLHttpRequest();
            xhr.open("POST", "/upload", true);

            xhr.upload.onprogress = (event) => {
                if (event.lengthComputable) {
                    const percent = (event.loaded / event.total) * 100;
                    progressBar.style.width = percent + "%";
                }
            };

            xhr.onload = () => {
                if (xhr.status === 200) {
                    window.location = "/";
                }
            };

            xhr.send(formData);
        });
    </script>
</body>
</html>
