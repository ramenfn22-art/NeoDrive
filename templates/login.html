<!DOCTYPE html>
<html>
<head>
    <title>Login - NeoDrive</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="page fade-in">

    <div class="container auth-container">

        <div class="auth-card">
            <img src="{{ url_for('static', filename='logo.png') }}" class="auth-logo">

            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to your vault</p>

            <form action="/login" method="POST">

                <input type="text" name="username" placeholder="Username" class="auth-input" required>
                <input type="password" name="password" placeholder="Password" class="auth-input" required>

                <button type="submit" class="primary-btn auth-btn">Login</button>
            </form>

            <p class="auth-switch">
                New here?
                <a href="/signup" class="ghost-btn small-btn">Create Account</a>
            </p>
        </div>

    </div>

</body>
</html>
