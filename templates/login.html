<!DOCTYPE html>
<html>
<head>
    <title>Login - NeoDrive</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-page fade-in">

    <div class="auth-container">

        <div class="auth-card">
            <img src="{{ url_for('static', filename='logo.png') }}" class="auth-logo">

            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Log in to access your NeoDrive</p>

            <form method="POST" class="auth-form">

                <label class="auth-label">Username</label>
                <input type="text" name="username" class="auth-input" required>

                <label class="auth-label">Password</label>
                <input type="password" name="password" class="auth-input" required>

                <button type="submit" class="primary-btn auth-btn">Log In</button>
            </form>

            <p class="auth-switch">
                Don’t have an account?
                <a href="/signup" class="auth-link">Create one</a>
            </p>
        </div>

    </div>

</body>
</html>
